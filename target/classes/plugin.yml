name: CommandMapper
version: 1.0.0
main: com.example.commandmapper.CommandMapper
api-version: '1.20'
description: 指令映射插件，支持BungeeCord
author: Etarnal_48

# 添加BungeeCord支持
bungeecord: true

commands:
  commandmapper:
    description: 管理指令映射插件
    aliases: [cm]

permissions:
  commandmapper.reload:
    description: 允许重载插件配置
    default: op